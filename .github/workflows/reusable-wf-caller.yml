name:
  Work flow Caller

on: workflow_dispatch

jobs:
  default-wf:
    uses: ./.github/workflows/reusable-wf-callee.yml

  test-explicit:
    uses: ./.github/workflows/reusable-wf-callee.yml
    with:
      node-version: '20'

  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    uses: ./.github/workflows/reusable-wf-callee.yml
    with:
      node-version: ${{matrix.node}}

  report:
    runs-on: ubuntu-latest
    needs: default-wf
    steps:
      - name: Reading callee's output
        run: |
          echo "The output of the callee version is ${{needs.default-wf.outputs.tested_version}}"
        



















          
