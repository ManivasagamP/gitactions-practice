name: Secrets and Variables

on:
  workflow_dispatch:

jobs:
  Sec-Var:
    runs-on: ubuntu-latest
    steps:
      - name: Checking secret
        env:
          API_KEY: "${{ secrets.MY_API_KEY }}"
        run: |
          if [ -z "$API_KEY" ]; then
            echo "No api key available"
            exit 1
          fi
            echo "Key is present and the length is ${#API_KEY}"
            echo "But when we try to see that: ${API_KEY}"

      - name: Realistic usage
        env:
          API_KEY: "${{ secrets.MY_API_KEY }}"
        run: |
          # eg curl -H "Authorization: Bearer $API_KEY" https://api.example.com
          echo "Calling the api wont work"

      - name: Checking var
        env:
          NAME: "${{ vars.NAME }}"
        run: |
          if [ -z "$NAME" ]; then
            echo "No variable key available"
            exit 1
          fi
            echo "Key is present and the length is ${#NAME}"
            echo "Here when we try to see that: ${NAME} it will show"
        












            
            
          
