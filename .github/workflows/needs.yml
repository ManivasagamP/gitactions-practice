name: Checking Needs dependencies

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: normal building the app
        run: |
          echo "Building the full code"
          sleep 7

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: testing the app
        run: |
          echo "Running the test file"
          sleep 5

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: lint the app
        run: |
          echo "Linting the app"
          sleep 2

  deply:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Deployment
        run: |
          echo "Everything is over test is passed"
          echo "Test result: ${{needs.test.result}}"
          echo "Lint result: ${{needs.lint.result}}"




















          
